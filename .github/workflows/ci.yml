name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: SwiftFormat Lint
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Install SwiftFormat
        run: brew install swiftformat
      - name: Run SwiftFormat lint
        run: swift format lint --recursive --parallel --strict -p .
      - name: Run SwiftFormat check
        run: swift format format --recursive --parallel --in-place -p . && git diff --exit-code --stat

  test:
    name: Build & Test
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - name: Build & Test
        # swiftpm-testing-helper may crash with SIGTRAP after all tests pass
        # (known SwiftPM bug). Capture output and check for failures manually.
        run: |
          swift test --parallel 2>&1 | tee test.log
          if grep -qE "^\✘" test.log; then
            echo "::error::Test failures detected"
            exit 1
          fi

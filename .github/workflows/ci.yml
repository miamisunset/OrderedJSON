name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: SwiftFormat Lint
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install SwiftFormat
        run: brew install swiftformat
      - name: Run SwiftFormat lint
        run: swift format lint --recursive --parallel -p .
      - name: Run SwiftFormat check
        run: swift format format --recursive --parallel --in-place -p . && git diff --exit-code --stat

  test:
    name: Build & Test
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Swift 6.3 via swiftly
        run: |
          curl -Ls https://swiftly.swift.org/install.sh | bash
          swiftly install 6.3.0
      - name: Build
        run: swiftly run swift build
      - name: Test
        run: swiftly run swift test

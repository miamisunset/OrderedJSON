name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: SwiftFormat Lint
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Install SwiftFormat
        run: brew install swiftformat
      - name: Run SwiftFormat lint
        run: swift format lint --recursive --parallel -p .
      - name: Run SwiftFormat check
        run: swift format format --recursive --parallel --in-place -p . && git diff --exit-code --stat

  test:
    name: Build & Test
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: swift build
      - name: Run tests (list then filter)
        run: |
          swift test --list-tests 2>/dev/null | head -5
          swift test --parallel --filter ".*" 2>&1

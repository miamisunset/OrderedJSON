name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: SwiftFormat Lint
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install SwiftFormat
        run: brew install swiftformat
      - name: Run SwiftFormat lint
        run: swift format lint --recursive --parallel -p .
      - name: Run SwiftFormat check
        run: swift format format --recursive --parallel --in-place -p . && git diff --exit-code --stat

  test:
    name: Build & Test
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Swiftly and Swift 6.3
        run: |
          curl -O https://download.swift.org/swiftly/darwin/swiftly.pkg
          installer -pkg swiftly.pkg -target CurrentUserHomeDirectory
          echo "$HOME/.swiftly/bin" >> $GITHUB_PATH
          swiftly init --assume-yes
          swiftly install 6.3.0
      - name: Build
        run: swift build
      - name: Test
        run: swift test
